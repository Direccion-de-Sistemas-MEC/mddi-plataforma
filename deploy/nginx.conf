# /etc/nginx/sites-available/mddi  — reemplazar mddi.ejemplo.gob.ar por el dominio real
server {
    listen 80;
    listen [::]:80;
    server_name mddi.ejemplo.gob.ar;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mddi.ejemplo.gob.ar;

    ssl_certificate     /etc/letsencrypt/live/mddi.ejemplo.gob.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mddi.ejemplo.gob.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
