# Alternativa con contenedores. Uso:  cp .env.example .env  (editar)  &&  docker compose -f deploy/docker-compose.yml up -d
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: mddi
      POSTGRES_USER: mddi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD en .env}
    volumes: ["mddi-db:/var/lib/postgresql/data"]
  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: always
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://mddi:${DB_PASSWORD}@db:5432/mddi
    ports: ["127.0.0.1:8080:8080"]   # solo local: publicar vía Nginx con HTTPS
    depends_on: [db]
volumes:
  mddi-db:
